<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Describe Your Dreams...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* General page setup */
        body {
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            background-color: #f0f0f0; /* Fallback background */
            background-image: url('{{ image_url }}'); /* Dynamic background image */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Styling the form container */
        .form-container {
            background: rgba(255, 255, 255, 0.7); /* Semi-transparent white background */
            border-radius: 10px;
            padding: 20px;
            margin: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        /* Styling for the title */
        .form-container h1 {
            color: #7d66ff; /* Pink color for the header */
            font-size: 2rem;
            margin-bottom: 20px;
        }

        /* Styling the textarea */
        .form-container textarea {
            background-color: #fff3f8; /* Light pink background */
            color: #333; /* Dark text for contrast */
            border: 1px solid #7d66ff;
            border-radius: 5px;
            font-size: 1rem;
            width: 100%;
            padding: 10px;
            margin-bottom: 20px; /* Add some space below the textarea */
        }

        /* Styling the submit button */
        .form-container input[type="submit"] {
            background-color: #7d66ff; /* Pink color for the button */
            color: white;
            border: none;
            padding: 10px 20px;
            width: 100%;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .form-container input[type="submit"]:hover {
            background-color: #6a54e6; /* Darker pink on hover */
        }

        /* Styling for the response container */
        .response-container {
            background: rgba(255, 255, 255, 0.7); /* Semi-transparent white background */
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        /* Styling the response text */
        .response-container h3 {
            color: #7d66ff;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .response-container .alert {
            background-color: #e6efff; /* Light pink alert background */
            color: #333; /* Dark text */
            border: 1px solid #7d66ff;
        }

        /* Optional: Add text shadow to improve readability */
        .form-container * {
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body {% if image_url %} style="background-image: url('{{ image_url }}'); background-size: cover; background-position: center; background-attachment: fixed;" {% endif %}>

    <!-- Form container positioned at the bottom left -->
    <div class="container text-center form-container">
        <h1 class="display-4">Describe Your Dreams...</h1>
        <form method="POST" class="mx-auto">
            <div class="mb-3">
                <textarea name="prompt" rows="4" class="form-control" placeholder="Enter your prompt..."></textarea>
            </div>
            <div class="d-grid">
                <input type="submit" value="Interpret" class="btn btn-primary">
            </div>
        </form>
    </div>

    <!-- Response container (only shown if result exists) -->
    {% if result %}
        <div class="container response-container">
            <h3 class="mt-4">Carl-puter Jung:</h3>
            <div class="alert alert-secondary">{{ result }}</div>
        </div>
    {% endif %}

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz4fnFO9gyb3T6lCPh+F8c0g7XyJwSLpx5jBZH/JVg8hJd3zFjlx35pG5Y" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0g3EXptXYzQHfxV9d0a6E2btUzI4nDhT0SEflzY5v4FIl+E5" crossorigin="anonymous"></script>
</body>
</html>
